databases:
  - name: todolistdb
    plan: free
    databaseName: todolist
    user: todolist

services:
  - type: web
    plan: free
    name: todolist-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn yourprojectname.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todolistdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

