<!-- django_price_comparer/price_app/templates/price_app/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Price Comparer</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'price_app/css/style.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Product Price Comparison</h1>

        <form id="priceComparisonForm" class="mb-8" method="POST">
            {% csrf_token %} <!-- Django's CSRF token -->
            <div class="mb-4">
                <label for="productQuery" class="block text-gray-700 text-sm font-semibold mb-2">
                    Enter Product Name:
                </label>
                <input type="text" id="productQuery" name="product_query"
                       class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
                       placeholder="e.g., Samsung Galaxy S24, iPhone 15" required>
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition duration-200 transform hover:scale-105">
                Compare Prices
            </button>
        </form>

        <div id="loadingIndicator" class="hidden text-center text-blue-600 font-semibold mb-4">
            <div class="flex items-center justify-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Searching for the best deals...
            </div>
        </div>

        <div id="results" class="hidden">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Comparison Results</h2>
            <div id="lowestPriceProduct" class="bg-green-100 border-l-4 border-green-500 text-green-800 p-4 rounded-lg mb-6 shadow-md">
                <p class="font-bold text-lg mb-2">Lowest Price Found:</p>
                <p id="lowestPriceName" class="text-xl font-bold"></p>
                <p id="lowestPriceValue" class="text-2xl font-extrabold"></p>
                <p id="lowestPriceSource" class="text-sm text-green-700"></p>
                <a id="lowestPriceLink" href="#" target="_blank" class="text-blue-600 hover:underline text-sm mt-2 block">View Product</a>
            </div>

            <h3 class="text-xl font-semibold text-gray-800 mb-3">All Results:</h3>
            <div id="allProductsList" class="space-y-4">
                <!-- Product cards will be inserted here by JavaScript -->
            </div>
            <p id="noResultsMessage" class="text-center text-gray-600 mt-4 hidden">No products found for your query.</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-100 border-l-4 border-red-500 text-red-800 p-4 rounded-lg mt-4 shadow-md">
            <p class="font-bold">Error:</p>
            <p id="errorText"></p>
        </div>
    </div>

    <script>
        document.getElementById('priceComparisonForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const productQuery = document.getElementById('productQuery').value;
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultsDiv = document.getElementById('results');
            const allProductsList = document.getElementById('allProductsList');
            const lowestPriceProductDiv = document.getElementById('lowestPriceProduct');
            const noResultsMessage = document.getElementById('noResultsMessage');
            const errorMessageDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            // Reset previous results and hide messages
            resultsDiv.classList.add('hidden');
            lowestPriceProductDiv.classList.add('hidden');
            allProductsList.innerHTML = '';
            noResultsMessage.classList.add('hidden');
            errorMessageDiv.classList.add('hidden');
            errorText.textContent = '';
            loadingIndicator.classList.remove('hidden');

            try {
                const formData = new FormData();
                formData.append('product_query', productQuery);
                // Get CSRF token from the form
                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

                const response = await fetch('/', { // <--- CHANGE THIS LINE: from '/compare' to '/'
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken // Include CSRF token in headers
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Something went wrong on the server.');
                }

                const data = await response.json();

                loadingIndicator.classList.add('hidden');
                resultsDiv.classList.remove('hidden');

                if (data.lowest_price_product) {
                    lowestPriceProductDiv.classList.remove('hidden');
                    document.getElementById('lowestPriceName').textContent = data.lowest_price_product.name;
                    document.getElementById('lowestPriceValue').textContent = `${data.lowest_price_product.currency} ${data.lowest_price_product.price.toLocaleString()}`;
                    document.getElementById('lowestPriceSource').textContent = `From: ${data.lowest_price_product.source}`;
                    document.getElementById('lowestPriceLink').href = data.lowest_price_product.url;
                } else {
                    lowestPriceProductDiv.classList.add('hidden');
                }

                if (data.results && data.results.length > 0) {
                    data.results.forEach(product => {
                        const productCard = `
                            <div class="bg-gray-50 p-4 rounded-lg shadow-sm flex items-center space-x-4">
                                ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}" class="w-20 h-20 object-contain rounded-md border border-gray-200">` : `<div class="w-20 h-20 bg-gray-200 rounded-md flex items-center justify-center text-gray-500 text-xs text-center">No Image</div>`}
                                <div class="flex-grow">
                                    <h4 class="text-lg font-semibold text-gray-900">${product.name}</h4>
                                    <p class="text-gray-700"><span class="font-bold">${product.currency} ${product.price.toLocaleString()}</span> from <span class="font-medium">${product.source}</span></p>
                                    <a href="${product.url}" target="_blank" class="text-blue-500 hover:underline text-sm">View Product</a>
                                </div>
                            </div>
                        `;
                        allProductsList.insertAdjacentHTML('beforeend', productCard);
                    });
                } else {
                    noResultsMessage.classList.remove('hidden');
                }

            } catch (error) {
                loadingIndicator.classList.add('hidden');
                errorMessageDiv.classList.remove('hidden');
                errorText.textContent = error.message;
                console.error('Fetch error:', error);
            }
        });
    </script>
</body>
</html>
