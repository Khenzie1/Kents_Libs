{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete Task</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .btn { padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: background-color 0.3s ease; }
        .btn-danger { background-color: #f44336; color: white; border: none; }
        .btn-danger:hover { background-color: #da190b; }
        .btn-secondary { background-color: #6b7280; color: white; border: none; }
        .btn-secondary:hover { background-color: #4b5563; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4">
    <div class="container bg-white shadow-lg rounded-lg p-6 text-center">
        <h1 class="text-3xl font-bold mb-6 text-red-600">Confirm Deletion</h1>

        <p class="text-xl mb-8">
            Are you sure you want to permanently delete the task:
            <br><strong class="text-red-700">"{{ item.name }}"</strong>?
        </p>

        <div class="flex justify-center space-x-4">
            <!-- Form to confirm deletion (submits POST to item_delete view) -->
            <form action="{% url 'item_delete' item.id %}" method="post" class="inline-block">
                {% csrf_token %}
                <button type="submit"
                        class="btn btn-danger bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                    Yes, Delete Task
                </button>
            </form>

            <!-- Link to cancel deletion (redirects back to list page) -->
            <a href="{% url 'item_list_create' %}"
               class="btn btn-secondary bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">
                Cancel
            </a>
        </div>
    </div>
</body>
</html>
